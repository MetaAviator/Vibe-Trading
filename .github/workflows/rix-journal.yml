name: Rix journal offline verification

on:
  push:
    branches: [codex/rix-journal-maintenance]
    paths:
      - maintenance/journal/**
      - agent/src/tools/trade_journal*.py
      - agent/tests/*journal*.py
      - agent/tests/test_generic_split_datetime.py
      - .github/workflows/rix-journal.yml
      - .gitattributes
  pull_request:
    branches: [codex/rix-journal-maintenance]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  journal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      replay-package-id: ${{ steps.replay.outputs.package-id }}
      review-bundle-sha256: ${{ steps.review-bundle.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install the hash-locked offline verification environment
        run: python -m pip install --require-hashes -r maintenance/journal/requirements.lock
      - name: Run journal tests without network access
        run: python -m pytest agent/tests/test*journal*.py agent/tests/test_generic_split_datetime.py maintenance/journal/tests --disable-socket -q
      - name: Check the independently linked synthetic ledger
        run: python maintenance/journal/check_ledger.py --output maintenance/journal/artifacts/synthetic
      - name: Verify index hygiene
        run: python tools/ci_private_files_gate.py
      - name: Build the public synthetic replay
        id: replay
        shell: bash
        env:
          PYTHONPATH: agent
        run: |
          python -m maintenance.journal.examples.synthetic_replay build "$RUNNER_TEMP/replay" \
            | tee "$RUNNER_TEMP/replay-build.json"
          package_id=$(python -c 'import json, sys; print(json.load(sys.stdin)["package_id"])' \
            < "$RUNNER_TEMP/replay-build.json")
          printf 'package-id=%s\n' "$package_id" >> "$GITHUB_OUTPUT"
      - name: Export the three synthetic evidence files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-replay-evidence
          path: |
            ${{ runner.temp }}/replay/research.zip
            ${{ runner.temp }}/replay/fills.csv
            ${{ runner.temp }}/replay/journal.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Generate a report and preserve the exact synthetic input CSV
        env:
          PYTHONPATH: agent
        run: |
          review="$RUNNER_TEMP/local-review"
          mkdir "$review"
          cp maintenance/journal/examples/synthetic_review_trades.csv "$review/trades.csv"
          python -m maintenance.journal.review_trades "$review/trades.csv" --output "$review/report.json"
      - name: Transfer the two synthetic report verification files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-csv-report-verification
          path: |
            ${{ runner.temp }}/local-review/trades.csv
            ${{ runner.temp }}/local-review/report.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - name: Pack and hash the synthetic CSV review bundle
        id: review-bundle
        shell: bash
        run: |
          review="$RUNNER_TEMP/local-review"
          python -S -m maintenance.journal.review_bundle build "$review/trades.csv" "$review/report.json" \
            --output "$review/review.zip" --verify-fifo | tee "$RUNNER_TEMP/review-bundle.json"
          digest=$(python -c 'import json,sys; print(json.load(sys.stdin)["bundle_sha256"])' < "$RUNNER_TEMP/review-bundle.json")
          printf 'sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Rebuild the FIFO reader ZIP and verify its published bytes
        run: |
          python -S -m maintenance.journal.examples.build_starter_zip "$RUNNER_TEMP/fifo-reader.zip" \
            --review-bundle "$RUNNER_TEMP/local-review/review.zip"
          cmp maintenance/journal/review-starter.zip "$RUNNER_TEMP/fifo-reader.zip"
      - name: Transfer the synthetic review ZIP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-csv-review-bundle
          path: ${{ runner.temp }}/local-review/review.zip
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  replay-verification:
    name: Recompute the Linux export on macOS
    needs: journal
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Download the evidence from Linux
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: synthetic-replay-evidence
          path: ${{ runner.temp }}/replay
      - name: Verify the exported evidence without the source snapshot
        env:
          EXPECTED_PACKAGE_ID: ${{ needs.journal.outputs.replay-package-id }}
        run: |
          mv maintenance/journal/examples/synthetic_stocks.csv "$RUNNER_TEMP/source-stocks.csv"
          python -S -m maintenance.journal.examples.synthetic_replay \
            verify "$RUNNER_TEMP/replay" --expected-id "$EXPECTED_PACKAGE_ID"
      - name: Rebuild and check the reader ZIP with the standard library
        run: |
          python -S -m maintenance.journal.examples.build_starter_zip "$RUNNER_TEMP/rebuilt-starter.zip"
          cmp maintenance/journal/replay-starter.zip "$RUNNER_TEMP/rebuilt-starter.zip"
          python -S -m zipfile -e "$RUNNER_TEMP/rebuilt-starter.zip" "$RUNNER_TEMP/starter"
          cd "$RUNNER_TEMP/starter"
          python -S -m maintenance.journal.examples.synthetic_replay \
            verify maintenance/journal/examples/starter_evidence \
            --expected-id "$(cat maintenance/journal/examples/starter-package-id.txt)"
      - name: Download the synthetic review ZIP
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: synthetic-csv-review-bundle
          path: ${{ runner.temp }}/review-bundle
      - name: Verify the transferred review ZIP with the standard library
        env:
          EXPECTED_BUNDLE_SHA256: ${{ needs.journal.outputs.review-bundle-sha256 }}
        run: |
          python -S -m maintenance.journal.review_bundle verify "$RUNNER_TEMP/review-bundle/review.zip" \
            --expected-sha256 "$EXPECTED_BUNDLE_SHA256" --verify-fifo \
            --output-html "$RUNNER_TEMP/review-bundle/receipt.html"
          grep -Fq "$EXPECTED_BUNDLE_SHA256" "$RUNNER_TEMP/review-bundle/receipt.html"
      - name: Download the Linux CSV and report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: synthetic-csv-report-verification
          path: ${{ runner.temp }}/local-review
      - name: Recalculate trade cash and FIFO from the transferred CSV
        run: |
          python -S -m maintenance.journal.review_trades "$RUNNER_TEMP/local-review/trades.csv" \
            --verify-report "$RUNNER_TEMP/local-review/report.json" --verify-fifo

  windows-installation:
    name: Try the reader ZIP and install Journal Lab on Windows
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify the public reader ZIP before installing dependencies
        run: |
          $starter = Join-Path $env:RUNNER_TEMP "starter"
          Expand-Archive maintenance/journal/replay-starter.zip -DestinationPath $starter
          Set-Location $starter
          python -S -m maintenance.journal.examples.synthetic_replay verify maintenance/journal/examples/starter_evidence --expected-id (Get-Content maintenance/journal/examples/starter-package-id.txt)
      - name: Verify the public FIFO reader ZIP before installing dependencies
        run: |
          $starter = Join-Path $env:RUNNER_TEMP "fifo-starter"
          Expand-Archive maintenance/journal/review-starter.zip -DestinationPath $starter
          Set-Location $starter
          $receipt = python -S -m maintenance.journal.review_bundle verify review.zip --expected-sha256 (Get-Content review-sha256.txt) --verify-fifo --output-html receipt.html
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = ($receipt -join "`n") | ConvertFrom-Json
          if ($result.recomputed_fifo_pnl -ne "1.61" -or $result.cash_check.fees -ne "0.39" -or $result.fifo_match_count -ne 3 -or !(Test-Path receipt.html)) {
            throw "Unexpected FIFO reader receipt"
          }
      - name: Install the hash-locked Journal Lab dependencies
        run: |
          python -m venv .venv-journal
          & .\.venv-journal\Scripts\python.exe -m pip install --require-hashes -r maintenance/journal/requirements.lock
      - name: Verify review bundle round trips and validation failures on Windows
        env:
          PYTHONPATH: agent
        run: |
          & .\.venv-journal\Scripts\python.exe -m pytest maintenance/journal/tests/test_review_bundle.py --disable-socket -q
      - name: Generate and reopen the report with the documented commands
        run: |
          $env:PYTHONPATH = "agent"
          $receipt = & .\.venv-journal\Scripts\python.exe -m maintenance.journal.examples.synthetic_replay build private-journal/synthetic-replay
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $receipt | Write-Output
          $package = ($receipt -join [Environment]::NewLine) | ConvertFrom-Json
          if ($package.net_pnl_usd -ne "4.00") { throw "Unexpected sample P&L" }
          Remove-Item Env:PYTHONPATH
          python -S -m maintenance.journal.examples.synthetic_replay verify private-journal/synthetic-replay --expected-id $package.package_id
      - name: Review the standalone trade CSV using the installed environment
        env:
          PYTHONPATH: agent
        run: |
          & .\.venv-journal\Scripts\python.exe -m maintenance.journal.review_trades maintenance/journal/examples/synthetic_review_trades.csv --output private-journal/synthetic-trade-report.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content private-journal/synthetic-trade-report.json -Raw | ConvertFrom-Json
          if ($report.cash_check.net_trade_cash -ne "1.61" -or $report.profile.total_pnl -ne 1.61) {
            throw "Unexpected standalone CSV review P&L"
          }
          Remove-Item Env:PYTHONPATH
          python -S -m maintenance.journal.review_trades maintenance/journal/examples/synthetic_review_trades.csv --verify-report private-journal/synthetic-trade-report.json --verify-fifo
